name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "DSL_CHAT_BOT/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DSL_CHAT_BOT/frontend/package-lock.json

      - name: Install dependencies
        working-directory: DSL_CHAT_BOT/frontend
        run: npm ci

      - name: Build React app
        working-directory: DSL_CHAT_BOT/frontend
        env:
          PUBLIC_URL: /chatbot-with-kt-dgucenter
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
        run: npm run build

      - name: Write runtime config
        working-directory: DSL_CHAT_BOT/frontend
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
        run: |
          cat > build/config.js <<EOF
          window.DGU_CHATBOT_CONFIG = {
            API_URL: "${REACT_APP_API_URL}"
          };
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: DSL_CHAT_BOT/frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
