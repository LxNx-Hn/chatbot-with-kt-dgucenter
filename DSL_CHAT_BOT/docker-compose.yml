version: "3.8"
services:
  backend:
    build: ./backend
    container_name: dsl_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    restart: always
    environment:
      - MODEL_PROVIDER=${MODEL_PROVIDER:-nim}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_MODEL=${NIM_MODEL:-meta/llama-3.1-8b-instruct}

  frontend:
    build: ./frontend
    container_name: dsl_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
